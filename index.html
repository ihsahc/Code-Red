<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Code Red</title>

  <!-- Leaflet (the map library), loaded from the internet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Code Red</h1>
    <div class="header-actions">
      <span id="data-source" class="data-source">Loading…</span>
      <button id="view-btn" class="view-tag" type="button">Staff View</button>
    </div>
  </header>

  <!-- The map fills the middle of the screen -->
  <main id="map" aria-label="Map of dispensers"></main>

  <!-- Bottom panel: legend, the main button, and the result -->
  <section class="panel">
    <ul class="legend" aria-label="Legend">
      <li><span class="dot green">✓</span> Over 50%</li>
      <li><span class="dot yellow">~</span> 15–50%</li>
      <li><span class="dot red">!</span> Under 15%</li>
      <li><span class="dot gray">?</span> Offline</li>
    </ul>

    <button id="find-btn" class="primary">Find nearest stocked (15%+)</button>

    <section id="staff-panel" hidden>
      <div class="staff-heading">
        <strong>Urgent refills</strong>
        <button id="student-btn" class="text-button" type="button">Student View</button>
      </div>
      <p class="staff-help">Empty dispensers first, then ones running low.</p>
      <div id="urgent-list" class="urgent-list" aria-live="polite"></div>
    </section>

    <!-- Shown only if the user says no to location access -->
    <div id="fallback" class="fallback" hidden>
      <label for="building-select">Location off. Pick your building instead:</label>
      <select id="building-select"></select>
    </div>

    <div id="result" class="result" role="status" aria-live="polite" hidden></div>

    <p class="privacy">Your location is only used on your device to sort distances. It is never stored or sent anywhere.</p>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
