# Render Blueprint: creates the website, the API, and a free Postgres database.
# On render.com: New → Blueprint → pick this repo.
services:
  # The website (index.html, app.js, ...). Only the frontend files are
  # published, so backend code and docs aren't served to visitors.
  - type: web
    name: code-red
    runtime: static
    buildCommand: >-
      mkdir -p dist && cp *.html *.js *.css dist/ &&
      if [ -d assets ]; then cp -r assets dist/; fi
    staticPublishPath: dist

  # The backend API.
  - type: web
    name: code-red-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: code-red-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "true"
      # Sensor calibration. Replace the placeholders once measured.
      - key: FULL_DISTANCE_MM
        value: "50"
      - key: EMPTY_DISTANCE_MM
        value: "400"
      - key: PRODUCT_THICKNESS_MM
        value: "18"
      - key: FULL_ABOVE_PERCENT
        value: "50"
      - key: EMPTY_BELOW_PERCENT
        value: "15"
      - key: OFFLINE_AFTER_MINUTES
        value: "2"
      - key: REFILL_JUMP_PERCENT
        value: "30"
      # The one real dispenser (Pico W): its own calibration, measured with
      # CALIBRATE = 1 on the device. Placeholders until then.
      - key: REAL_EMPTY_DISTANCE_MM
        value: "155"
      - key: REAL_FULL_DISTANCE_MM
        value: "40"
      # Secret key the Pico sends. Set the value in the Render dashboard;
      # "sync: false" keeps it out of this file.
      - key: REAL_DEVICE_KEY
        sync: false

databases:
  - name: code-red-db
    plan: free
